<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Production calculator and planner</title><desc id="desc">A capacity planning dashboard with production bars, forecast line and scenario metrics.</desc>
