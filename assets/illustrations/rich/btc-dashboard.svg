<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">BTC production intelligence dashboard</title>
  <desc id="desc">A dark operations dashboard with KPI cards, production charts and live machine status.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071922"/><stop offset="1" stop-color="#02090e"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#12313a"/><stop offset="1" stop-color="#06141c"/></linearGradient>
    <linearGradient id="cyan" x2="1"><stop stop-color="#00f5df"/><stop offset="1" stop-color="#59ff6a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#54e7d0" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="700" rx="24" fill="url(#bg)"/><rect x="28" y="28" width="1144" height="644" rx="18" fill="url(#grid)" stroke="#38d9c0" stroke-opacity=".38"/>
  <rect x="58" y="58" width="210" height="584" rx="12" fill="#06131b" stroke="#36cdb8" stroke-opacity=".2"/>
  <circle cx="94" cy="95" r="17" fill="#0d3d43" stroke="#59ff6a"/><path d="M86 95h16M94 87v16" stroke="#d6fff2" stroke-width="3"/><text x="125" y="92" fill="#e5fff8" font-family="Arial" font-size="20" font-weight="700">BTC CONTROL</text><text x="125" y="115" fill="#6ef4c7" font-family="monospace" font-size="12">PRODUCTION INTELLIGENCE</text>
  <g fill="#87aaa8" font-family="monospace" font-size="15"><text x="90" y="176">OVERVIEW</text><text x="90" y="222">MACHINE EVENTS</text><text x="90" y="268">SHIFT REPORTS</text><text x="90" y="314">TRACEABILITY</text><text x="90" y="360">ANALYTICS</text></g>
  <g fill="#1b4d51"><rect x="84" y="145" width="145" height="3" rx="2"/><rect x="84" y="191" width="145" height="3" rx="2"/><rect x="84" y="237" width="145" height="3" rx="2"/><rect x="84" y="283" width="145" height="3" rx="2"/><rect x="84" y="329" width="145" height="3" rx="2"/></g>
  <rect x="305" y="58" width="837" height="68" rx="12" fill="#081b24" stroke="#39d8c1" stroke-opacity=".25"/><text x="340" y="86" fill="#62f6bd" font-family="monospace" font-size="15">LIVE PRODUCTION MONITOR</text><text x="340" y="108" fill="#7fa7a8" font-family="Arial" font-size="14">Factory floor / all lines nominal</text><circle cx="1065" cy="91" r="8" fill="#59ff6a" filter="url(#glow)"/><text x="1082" y="97" fill="#59ff6a" font-family="monospace" font-size="14">ONLINE</text>
  <g><rect x="305" y="151" width="190" height="100" rx="10" fill="url(#screen)" stroke="#36d7c0" stroke-opacity=".32"/><rect x="515" y="151" width="190" height="100" rx="10" fill="url(#screen)" stroke="#36d7c0" stroke-opacity=".32"/><rect x="725" y="151" width="190" height="100" rx="10" fill="url(#screen)" stroke="#36d7c0" stroke-opacity=".32"/><rect x="935" y="151" width="207" height="100" rx="10" fill="url(#screen)" stroke="#36d7c0" stroke-opacity=".32"/></g>
  <g font-family="monospace"><g fill="#86aaa8" font-size="13"><text x="325" y="180">OUTPUT / SHIFT</text><text x="535" y="180">UPTIME</text><text x="745" y="180">ACTIVE LINES</text><text x="955" y="180">ALERTS</text></g><g fill="#f2fff9" font-size="34" font-weight="700"><text x="325" y="225">25+</text><text x="535" y="225">99.9%</text><text x="745" y="225">04</text><text x="955" y="225">02</text></g></g>
  <rect x="305" y="278" width="510" height="335" rx="12" fill="#07161e" stroke="#36d7c0" stroke-opacity=".3"/><text x="333" y="312" fill="#d5fff2" font-family="monospace" font-size="16">PRODUCTION / HOURLY</text><path d="M338 550V350M338 550H780" stroke="#37656a"/><g stroke="#32666a" stroke-opacity=".45"><path d="M338 400H780M338 450H780M338 500H780"/></g><path d="M350 505C400 470 418 482 458 426S520 450 558 388s55 68 105-12 50 22 103-78" fill="none" stroke="url(#cyan)" stroke-width="6" filter="url(#glow)"/><path d="M350 505C400 470 418 482 458 426S520 450 558 388s55 68 105-12 50 22 103-78" fill="none" stroke="#d5fff2" stroke-width="1.5"/><g fill="#59ff6a"><circle cx="458" cy="426" r="6"/><circle cx="558" cy="388" r="6"/><circle cx="663" cy="376" r="6"/></g>
  <rect x="840" y="278" width="302" height="335" rx="12" fill="#07161e" stroke="#36d7c0" stroke-opacity=".3"/><text x="868" y="312" fill="#d5fff2" font-family="monospace" font-size="16">LINE STATUS</text><g font-family="Arial" font-size="14"><text x="870" y="362" fill="#86aaa8">MAKER / NX3</text><text x="1090" y="362" text-anchor="end" fill="#59ff6a">RUNNING</text><text x="870" y="420" fill="#86aaa8">PACKER</text><text x="1090" y="420" text-anchor="end" fill="#59ff6a">READY</text><text x="870" y="478" fill="#86aaa8">WRAPPER</text><text x="1090" y="478" text-anchor="end" fill="#f4d36c">CHECK</text></g><g fill="#18383d"><rect x="870" y="378" width="240" height="8" rx="4"/><rect x="870" y="436" width="240" height="8" rx="4"/><rect x="870" y="494" width="240" height="8" rx="4"/></g><g fill="url(#cyan)"><rect x="870" y="378" width="184" height="8" rx="4"/><rect x="870" y="436" width="218" height="8" rx="4"/><rect x="870" y="494" width="112" height="8" rx="4"/></g></svg>
