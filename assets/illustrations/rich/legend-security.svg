<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Legend investigations platform</title><desc id="desc">A shield security emblem surrounded by investigation nodes, network routes and evidence markers.</desc>
