  <g transform="translate(450 92)"><path d="M150 0 310 58v148c0 124-75 202-160 250C65 408 0 330 0 206V58z" fill="url(#shield)" stroke="#a9d9e6" stroke-width="5"/><path d="M150 28 278 76v127c0 99-55 164-128 208C77 367 22 302 22 203V76z" fill="none" stroke="#3af2ce" stroke-opacity=".75" stroke-width="4"/><path d="M150 106c-45 0-78 34-78 78v42h-19v78h194v-78h-19v-42c0-44-33-78-78-78zm-46 120v-41c0-27 20-47 46-47s46 20 46 47v41z" fill="url(#security-accent)" filter="url(#glow)"/><rect x="137" y="214" width="26" height="48" rx="10" fill="#1b2530"/><circle cx="150" cy="239" r="7" fill="#74ffb1"/></g><g fill="#60ffe2" filter="url(#glow)"><circle cx="130" cy="190" r="5"/><circle cx="1070" cy="190" r="5"/><circle cx="130" cy="510" r="5"/><circle cx="1070" cy="510" r="5"/></g><text x="600" y="640" text-anchor="middle" fill="#e5f5fa" font-family="monospace" font-size="18" letter-spacing="5">LEGEND INVESTIGATIONS PLATFORM</text></svg>
